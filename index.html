const devId=()=>{try{let d=localStorage.getItem("mkk_dev");if(!d){d=crypto.randomUUID();localStorage.setItem("mkk_dev",d)}return d}catch(e){return null}};
const look=async()=>{const el=$("#res");el.textContent="…";const r=await DB.rpc("get_certs",{sn:$("#sn").value,dev:devId()});if(r.error){el.textContent=/locked/.test(r.error.message)?T("تم قفل البحث لمدة 24 ساعة بسبب كثرة المحاولات","Te veel pogingen. Probeer het over 24 uur opnieuw."):T("حدث خطأ، حاول لاحقاً","Er ging iets mis. Probeer later opnieuw.");return}
 el.innerHTML=r.data.length?rec(r.data):`<p class="m">${T("لا توجد شهادات لهذا الرقم","Geen attesten gevonden")}</p>`};
const login=()=>show(`${hdr("pub()")}<h2>${T("دخول المالك","Beheerder")}</h2><label>E-mail<input type="email" id="em" autocomplete="username"></label><label>${T("كلمة المرور","Wachtwoord")}<input type="password" id="pw" autocomplete="current-password"></label><button onclick="doLogin()">${T("دخول","Inloggen")}</button><div id="msg"></div>`);
const doLogin=async()=>{const r=await DB.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(r.error){$("#msg").textContent=r.error.message;return}await loadMeta();home()};
const logout=async()=>{await DB.auth.signOut();S.customers=[];pub()};
(async()=>{if(!S.lang)S.lang="nl";const s=await DB.auth.getSession();if(s.data.session){await loadMeta();home()}else pub()})();
</script></body></html>
